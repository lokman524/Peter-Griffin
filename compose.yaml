
services:

  # For the text to speech service for the backend to transcribe text to speech
  tts:
    image: ghcr.io/coqui-ai/tts
    ports:
      - "5002:5002"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    entrypoint: >
      bash -c "
        python3 TTS/server/server.py --model_name tts_models/en/vctk/vits --use_cuda true
      "
    stdin_open: true
    tty: true
    restart: "no"